apiVersion: v1
kind: Service
metadata:
  name: stockpilot-postgres
  labels:
    app.kubernetes.io/name: stockpilot-postgres
    app.kubernetes.io/part-of: stockpilot
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: stockpilot-postgres
