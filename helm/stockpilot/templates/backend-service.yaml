apiVersion: v1
kind: Service
metadata:
  name: stockpilot-backend
  labels:
    app.kubernetes.io/name: stockpilot-backend
    app.kubernetes.io/part-of: stockpilot
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: stockpilot-backend
