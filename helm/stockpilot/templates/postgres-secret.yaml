# DEV ONLY placeholder credentials. Not for production. Replace with a real secret manager
# (for example External Secrets or sealed-secrets) outside this capstone.
apiVersion: v1
kind: Secret
metadata:
  name: stockpilot-postgres-secret
  labels:
    app.kubernetes.io/name: stockpilot-postgres
    app.kubernetes.io/part-of: stockpilot
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:%d/%s" .Values.postgres.user .Values.postgres.password .Values.postgres.name (int .Values.postgres.port) .Values.postgres.database | quote }}
